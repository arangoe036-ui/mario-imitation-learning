name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # numpy<2 first: nes-py's ROM loader and its gym pin are numpy-1 only.
          pip install "numpy<2"
          # The dev extra brings pytest AND torch. Without torch, 41 of the 324 tests are
          # not even collected, so a green badge would be covering 284 tests, not 324.
          # No `|| true` here: if the documented install breaks, this job must go red.
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q -rs
